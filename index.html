<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.hd{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 14px}

.sub{color:var(--mut);font-size:13px}.c{text-align:center}
.hr{display:flex;gap:8px;align-items:center}
.gb{background:var(--fill);color:var(--blue);border:0;border-radius:16px;padding:6px 12px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
.pb{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.pb.round{width:32px;height:32px;border-radius:16px;padding:0;font-size:22px;line-height:1}
.pb.sm{padding:6px 10px;font-size:12px;border-radius:12px;white-space:nowrap}
.wide{display:block;width:100%;margin:10px 0}
.grp{background:var(--card);border-radius:12px;overflow:hidden;margin:0 0 18px}

.gr{flex:1;min-width:0}.gh{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin:0 0 6px 14px}
.chev{color:var(--mut);font-size:22px}
.ico{width:36px;height:36px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#a2845e,#6f4e37);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.chips,.rt{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

.red{color:var(--red)}.big{font-size:28px;font-weight:700}

textarea{min-height:80px}

.pad{padding:14px}
